<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Expense Tracker</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome 6 Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.5);
            --accent-cyan: #06b6d4;
            --accent-pink: #ec4899;
            --dark-bg: #090d16;
            --card-bg: rgba(18, 24, 38, 0.72);
            --border-glass: rgba(255, 255, 255, 0.12);
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--dark-bg);
            overflow-x: hidden;
            position: relative;
            perspective: 1200px;
            padding: 1.5rem;
        }

        /* ========== 3D SCENE BACKGROUND ========== */
        .bg-scene {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }

        /* 3D Glowing Ambient Orbs */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.65;
            animation: floatOrb 18s ease-in-out infinite alternate;
        }

        .orb-1 {
            width: 480px;
            height: 480px;
            background: radial-gradient(circle, #6366f1 0%, rgba(99, 102, 241, 0) 70%);
            top: -100px;
            left: -100px;
            animation-duration: 16s;
        }

        .orb-2 {
            width: 520px;
            height: 520px;
            background: radial-gradient(circle, #ec4899 0%, rgba(236, 72, 153, 0) 70%);
            bottom: -150px;
            right: -100px;
            animation-duration: 22s;
            animation-delay: -5s;
        }

        .orb-3 {
            width: 380px;
            height: 380px;
            background: radial-gradient(circle, #06b6d4 0%, rgba(6, 182, 212, 0) 70%);
            top: 45%;
            left: 55%;
            animation-duration: 20s;
            animation-delay: -9s;
        }

        @keyframes floatOrb {
            0% { transform: translate3d(0, 0, 0) scale(1); }
            50% { transform: translate3d(60px, 80px, 50px) scale(1.15); }
            100% { transform: translate3d(-50px, -40px, -30px) scale(0.95); }
        }

        /* 3D Floating Geometric Polyhedra */
        .geo-shape {
            position: absolute;
            transform-style: preserve-3d;
            opacity: 0.28;
            pointer-events: none;
        }

        .geo-1 {
            top: 15%;
            right: 18%;
            width: 100px;
            height: 100px;
            animation: rotate3dShape1 24s linear infinite;
        }

        .geo-2 {
            bottom: 20%;
            left: 15%;
            width: 120px;
            height: 120px;
            animation: rotate3dShape2 30s linear infinite reverse;
        }

        .cube-wireframe {
            position: relative;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
        }

        .cube-face {
            position: absolute;
            width: 100px;
            height: 100px;
            border: 2px solid rgba(255, 255, 255, 0.4);
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.15), rgba(6, 182, 212, 0.05));
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.3) inset;
            border-radius: 12px;
        }

        .face-front  { transform: translateZ(50px); }
        .face-back   { transform: rotateY(180deg) translateZ(50px); }
        .face-right  { transform: rotateY(90deg) translateZ(50px); }
        .face-left   { transform: rotateY(-90deg) translateZ(50px); }
        .face-top    { transform: rotateX(90deg) translateZ(50px); }
        .face-bottom { transform: rotateX(-90deg) translateZ(50px); }

        @keyframes rotate3dShape1 {
            0%   { transform: rotateX(0deg) rotateY(0deg) rotateZ(0deg) translateY(0); }
            50%  { transform: rotateX(180deg) rotateY(240deg) rotateZ(180deg) translateY(-25px); }
            100% { transform: rotateX(360deg) rotateY(480deg) rotateZ(360deg) translateY(0); }
        }

        @keyframes rotate3dShape2 {
            0%   { transform: rotateX(30deg) rotateY(0deg) rotateZ(0deg) translateY(0); }
            50%  { transform: rotateX(210deg) rotateY(180deg) rotateZ(180deg) translateY(30px); }
            100% { transform: rotateX(390deg) rotateY(360deg) rotateZ(360deg) translateY(0); }
        }

        /* 3D Grid Floor Horizon */
        .grid-floor {
            position: absolute;
            bottom: -20%;
            left: -50%;
            width: 200%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
            background-size: 60px 60px;
            transform: rotateX(75deg);
            transform-origin: center bottom;
            mask-image: radial-gradient(ellipse at center, rgba(0,0,0,0.8) 0%, transparent 70%);
            -webkit-mask-image: radial-gradient(ellipse at center, rgba(0,0,0,0.8) 0%, transparent 70%);
        }

        /* ========== 3D INTERACTIVE LOGIN CARD ========== */
        .card-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 420px;
            transform-style: preserve-3d;
            transition: transform 0.15s ease-out;
        }

        .login-card {
            background: var(--card-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--border-glass);
            border-radius: 24px;
            padding: 2.5rem 2.25rem;
            box-shadow: 
                0 30px 60px -12px rgba(0, 0, 0, 0.6),
                0 0 0 1px rgba(255, 255, 255, 0.08) inset,
                0 0 35px -5px rgba(99, 102, 241, 0.25);
            position: relative;
            overflow: hidden;
            transform-style: preserve-3d;
        }

        /* Card Top Border Accent Glow */
        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 15%;
            right: 15%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #6366f1, #06b6d4, transparent);
            border-radius: 2px;
        }

        /* Brand & Header */
        .brand-header {
            text-align: center;
            margin-bottom: 2rem;
            transform: translateZ(35px);
        }

        .brand-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 1rem;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.25), rgba(6, 182, 212, 0.25));
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.85rem;
            color: #38bdf8;
            box-shadow: 0 12px 25px -4px rgba(99, 102, 241, 0.4);
            transform: translateZ(40px);
            animation: pulseGlow 4s ease-in-out infinite alternate;
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 12px 25px -4px rgba(99, 102, 241, 0.4); }
            100% { box-shadow: 0 16px 35px 2px rgba(6, 182, 212, 0.5); }
        }

        .brand-header h1 {
            font-size: 1.7rem;
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: -0.02em;
            margin-bottom: 0.35rem;
        }

        .brand-header p {
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 400;
        }

        /* Form Inputs */
        .form-group {
            margin-bottom: 1.25rem;
            transform: translateZ(25px);
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #cbd5e1;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.01em;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 1rem;
            color: #64748b;
            font-size: 1rem;
            pointer-events: none;
            transition: color 0.25s ease;
            z-index: 2;
        }

        .input-wrapper input {
            width: 100%;
            padding: 0.85rem 1rem 0.85rem 2.85rem;
            background: rgba(15, 23, 42, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            color: #f8fafc;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .input-wrapper input:focus {
            border-color: #6366f1;
            background: rgba(15, 23, 42, 0.9);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.2), 0 0 20px rgba(99, 102, 241, 0.25);
        }

        .input-wrapper input:focus + .input-icon,
        .input-wrapper input:focus ~ .input-icon {
            color: #6366f1;
        }

        .input-wrapper input::placeholder {
            color: #475569;
        }

        /* Password Seeing Facility (Toggle Button) */
        .password-toggle-btn {
            position: absolute;
            right: 0.75rem;
            background: transparent;
            border: none;
            color: #94a3b8;
            padding: 0.4rem 0.5rem;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            transition: all 0.2s ease;
            z-index: 3;
        }

        .password-toggle-btn:hover {
            color: #f1f5f9;
            background: rgba(255, 255, 255, 0.08);
        }

        .password-toggle-btn:focus {
            outline: none;
            color: #38bdf8;
        }

        /* Submit Button */
        .btn-submit {
            width: 100%;
            margin-top: 0.85rem;
            padding: 0.95rem 1.5rem;
            background: linear-gradient(135deg, #4f46e5 0%, #06b6d4 100%);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.02em;
            cursor: pointer;
            box-shadow: 0 10px 25px -4px rgba(79, 70, 229, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.15) inset;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transform: translateZ(30px);
        }

        .btn-submit:hover {
            transform: translateZ(35px) translateY(-2px);
            box-shadow: 0 16px 32px -4px rgba(79, 70, 229, 0.65), 0 0 25px rgba(6, 182, 212, 0.4);
            filter: brightness(1.08);
        }

        .btn-submit:active {
            transform: translateZ(25px) translateY(1px);
            box-shadow: 0 6px 15px -2px rgba(79, 70, 229, 0.5);
        }

        /* Register Footer Link */
        .register-footer {
            text-align: center;
            margin-top: 1.75rem;
            font-size: 0.88rem;
            color: var(--text-muted);
            transform: translateZ(20px);
        }

        .register-footer a {
            color: #38bdf8;
            font-weight: 600;
            text-decoration: none;
            transition: color 0.2s ease;
            margin-left: 0.25rem;
        }

        .register-footer a:hover {
            color: #818cf8;
            text-decoration: underline;
        }

        /* Flash Message Alerts */
        .alert-box {
            margin-top: 1.25rem;
            padding: 0.85rem 1rem;
            border-radius: 12px;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            transform: translateZ(25px);
            animation: fadeInAlert 0.4s ease-out;
        }

        @keyframes fadeInAlert {
            from { opacity: 0; transform: translateY(-8px) translateZ(25px); }
            to { opacity: 1; transform: translateY(0) translateZ(25px); }
        }

        .alert-danger {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.35);
            color: #fca5a5;
        }

        .alert-success {
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid rgba(34, 197, 94, 0.35);
            color: #86efac;
        }

        /* Mobile Adjustments */
        @media (max-width: 480px) {
            .login-card {
                padding: 2rem 1.5rem;
                border-radius: 20px;
            }
            .brand-header h1 {
                font-size: 1.45rem;
            }
        }
    </style>
</head>
<body>

    <!-- 3D Scene Background Elements -->
    <div class="bg-scene">
        <!-- Radial Glowing 3D Orbs -->
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>

        <!-- 3D Geometric Floating Cube 1 -->
        <div class="geo-shape geo-1">
            <div class="cube-wireframe">
                <div class="cube-face face-front"></div>
                <div class="cube-face face-back"></div>
                <div class="cube-face face-right"></div>
                <div class="cube-face face-left"></div>
                <div class="cube-face face-top"></div>
                <div class="cube-face face-bottom"></div>
            </div>
        </div>

        <!-- 3D Geometric Floating Cube 2 -->
        <div class="geo-shape geo-2">
            <div class="cube-wireframe">
                <div class="cube-face face-front"></div>
                <div class="cube-face face-back"></div>
                <div class="cube-face face-right"></div>
                <div class="cube-face face-left"></div>
                <div class="cube-face face-top"></div>
                <div class="cube-face face-bottom"></div>
            </div>
        </div>

        <!-- 3D Grid Perspective Floor -->
        <div class="grid-floor"></div>
    </div>

    <!-- 3D Interactive Card Wrapper -->
    <div class="card-wrapper" id="cardWrapper">
        <div class="login-card" id="loginCard">
            <!-- Brand & Heading -->
            <div class="brand-header">
                <div class="brand-icon">
                    <i class="fa-solid fa-wallet"></i>
                </div>
                <h1>Welcome Back</h1>
                <p>Sign in to your Expense Tracker account</p>
            </div>

            <!-- Login Form -->
            <form action="{{ url_for('login') }}" method="POST">
                <div class="form-group">
                    <label for="identifier">Email or Phone Number</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-user input-icon"></i>
                        <input
                            type="text"
                            id="identifier"
                            name="identifier"
                            placeholder="Enter Gmail or phone number"
                            autocomplete="username"
                            required
                        >
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >
                        <!-- Password Seeing Facility Button -->
                        <button
                            type="button"
                            class="password-toggle-btn"
                            id="togglePasswordBtn"
                            aria-label="Toggle password visibility"
                            title="Show/Hide password"
                        >
                            <i class="fa-solid fa-eye" id="togglePasswordIcon"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-submit">
                    <span>Sign In</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </button>
            </form>

            <!-- Register Link -->
            <div class="register-footer">
                Don't have an account?
                <a href="{{ url_for('register') }}">Create an account</a>
            </div>

            <!-- Flash Notifications -->
            {% with messages = get_flashed_messages(with_categories=true) %}
              {% if messages %}
                {% for category, message in messages %}
                  <div class="alert-box alert-{{ category }}">
                    <i class="fa-solid {% if category == 'danger' %}fa-circle-exclamation{% else %}fa-circle-check{% endif %}"></i>
                    <span>{{ message }}</span>
                  </div>
                {% endfor %}
              {% endif %}
            {% endwith %}
        </div>
    </div>

    <!-- Interactive 3D Parallax & Password Seeing Logic -->
    <script>
        // 1. Password Seeing Facility (Show/Hide Toggle)
        const toggleBtn = document.getElementById('togglePasswordBtn');
        const passwordInput = document.getElementById('password');
        const toggleIcon = document.getElementById('togglePasswordIcon');

        toggleBtn.addEventListener('click', function (e) {
            e.preventDefault();
            const isPassword = passwordInput.getAttribute('type') === 'password';
            
            if (isPassword) {
                passwordInput.setAttribute('type', 'text');
                toggleIcon.classList.remove('fa-eye');
                toggleIcon.classList.add('fa-eye-slash');
            } else {
                passwordInput.setAttribute('type', 'password');
                toggleIcon.classList.remove('fa-eye-slash');
                toggleIcon.classList.add('fa-eye');
            }
        });

        // 2. Interactive 3D Card Parallax Tilt on Mouse Movement
        const cardWrapper = document.getElementById('cardWrapper');
        const loginCard = document.getElementById('loginCard');

        // Only enable interactive tilt on devices with hover/pointer capability
        if (window.matchMedia('(hover: hover) and (pointer: fine)').matches) {
            let isHovering = false;

            document.addEventListener('mousemove', (e) => {
                const { innerWidth, innerHeight } = window;
                const x = e.clientX;
                const y = e.clientY;

                // Calculate tilt angles (-14deg to +14deg max)
                const rotateX = ((y / innerHeight) - 0.5) * -18;
                const rotateY = ((x / innerWidth) - 0.5) * 18;

                cardWrapper.style.transform = `rotateX(${rotateX.toFixed(2)}deg) rotateY(${rotateY.toFixed(2)}deg)`;
            });

            document.addEventListener('mouseleave', () => {
                cardWrapper.style.transition = 'transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1)';
                cardWrapper.style.transform = 'rotateX(0deg) rotateY(0deg)';
                setTimeout(() => {
                    cardWrapper.style.transition = 'transform 0.15s ease-out';
                }, 600);
            });
        }
    </script>
</body>
</html>
